[package]
name        = "vl53l1x-nv"
version     = "0.1.0"
description = "A driver for ST's VL53L1X long-distance time-of-flight ranging sensor on an I2C bus: the 91-byte default configuration, the short and long distance modes, the timing budget and inter-measurement period, ranging with the range status, signal and ambient rates, the region of interest from 4 by 4 up to 16 by 16 SPADs and a 4 by 4 zone scan, the distance thresholds, the offset and cross-talk calibrations, the interrupt polarity, the I2C address change and XSHUT, as devices-nv's Rangefinder, RangefinderZones and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["vl53l1x", "time-of-flight", "tof", "rangefinder", "distance", "lidar", "spad", "roi", "i2c", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/vl53l1x-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

# The package is checked at the embedded tier, the strictest one, so
# every function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading a VL53L1X time-of-flight sensor from a device program"

[dependencies]
# The board's I2C bus, GPIO and timer handles, and the I2cBus, GpioOut
# and Timer traits they implement.
embedded-hal-nv = "^0.3.2"
# The Rangefinder, RangefinderZones and Identifiable traits, the wiring
# record a board's device table hands `attach`, and the register helpers.
devices-nv      = "^0.3.3"
